[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "own-the-machine-weekly"
version = "0.1.0"
description = "Zero-key weekly industrial investment magazine pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app"]
