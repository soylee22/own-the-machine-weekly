name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python test dependency
        run: python3 -m pip install --requirement requirements-dev.txt
      - name: Run Python tests
        run: python3 -m pytest tests -q
      - name: Compile Python
        run: python3 -m compileall -q app run.py
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Build static site
        working-directory: site
        run: npm run build
      - name: Install browser test tools
        working-directory: site
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          mkdir -p /tmp/pages/own-the-machine-weekly
          cp -R site/dist/. /tmp/pages/own-the-machine-weekly/
          python3 -m http.server 4321 --bind 127.0.0.1 --directory /tmp/pages > /tmp/own-machine-preview.log 2>&1 &
          echo $! > /tmp/own-machine-preview.pid
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:4321/own-the-machine-weekly/ > /dev/null
      - name: Run browser, layout and accessibility checks
        working-directory: site
        run: npx playwright test
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            site/playwright-report
            site/test-results
            /tmp/own-machine-preview.log
          if-no-files-found: ignore
          retention-days: 7
